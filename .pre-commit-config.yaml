repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the pinned ruff in backend/pyproject.toml, or the hook
    # formats code that CI's `ruff format --check .` then rejects.
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
