# Production deployment manifest for Dental Radar.
# Usage:
#   cp .env.production.example .env.production
#   export $(grep -v '^#' .env.production | xargs)
#   ./scripts/deploy.sh

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dental_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dental_radar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dental_radar} -d ${POSTGRES_DB:-dental_radar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: ${API_IMAGE:-ghcr.io/${GITHUB_REPOSITORY:-local/dental-radar}/api:${IMAGE_TAG:-main}}
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dental_radar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dental_radar}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${API_IMAGE:-ghcr.io/${GITHUB_REPOSITORY:-local/dental-radar}/api:${IMAGE_TAG:-main}}
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dental_radar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dental_radar}
      API_KEY: ${API_KEY:?API_KEY is required}
      # Never enable in production. Empty API_KEY without this fails closed (503).
      ALLOW_UNAUTHENTICATED: "false"
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      PLACES_MAX_PAGES: ${PLACES_MAX_PAGES:-3}
      AI_PROVIDER: ${AI_PROVIDER:-gpt}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-}
      AI_RETRY_MAX: ${AI_RETRY_MAX:-3}
      AI_MAX_SITE_TEXT_CHARS: ${AI_MAX_SITE_TEXT_CHARS:-8000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      APP_ENV: production
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
    # Bind loopback by default so the API is not exposed on all interfaces.
    # Front with a reverse proxy on the host, or override API_BIND for LAN access.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  worker:
    image: ${API_IMAGE:-ghcr.io/${GITHUB_REPOSITORY:-local/dental-radar}/api:${IMAGE_TAG:-main}}
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.workers.rescore"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dental_radar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dental_radar}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/${GITHUB_REPOSITORY:-local/dental-radar}/frontend:${IMAGE_TAG:-main}}
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_URL: http://api:8000/api/v1
      API_KEY: ${API_KEY:?API_KEY is required}
    ports:
      # The frontend BFF is the operator authorization boundary. Keep it behind
      # a trusted reverse proxy or explicitly override only on an isolated network.
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/clinics >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres_data:
