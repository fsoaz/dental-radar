name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
      - name: Audit backend production dependencies
        working-directory: backend
        run: |
          uv sync --locked --extra dev
          uv export --quiet --locked --no-dev --no-emit-project --output-file /tmp/dental-radar-requirements.txt
          uv run --locked pip-audit --requirement /tmp/dental-radar-requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dental_radar
          POSTGRES_PASSWORD: dental_radar
          POSTGRES_DB: dental_radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dental_radar -d dental_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"

      - name: Backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://dental_radar:dental_radar@localhost:5432/dental_radar_test
        run: |
          uv sync --locked --extra dev
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked alembic upgrade head
          uv run --locked pytest -v

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test

  build-and-push:
    needs: [security, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image prefix
        run: echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:main
            ${{ env.IMAGE_PREFIX }}/api:sha-${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:main
            ${{ env.IMAGE_PREFIX }}/frontend:sha-${{ github.sha }}

  smoke-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare production env
        run: |
          cat > .env.production <<'EOF'
          POSTGRES_USER=dental_radar
          POSTGRES_PASSWORD=ci-smoke-password
          POSTGRES_DB=dental_radar
          API_KEY=ci-smoke-api-key
          CORS_ORIGINS=http://localhost:3000
          LOG_JSON=true
          GITHUB_REPOSITORY=local/dental-radar
          IMAGE_TAG=smoke
          EOF

      - name: Build and start production stack
        run: |
          docker compose --env-file .env.production -f docker-compose.prod.yml build
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d

      - name: Wait for readiness
        run: ./scripts/wait-for-health.sh

      - name: Rollback smoke test
        run: ./scripts/rollback.sh smoke

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml down -v
