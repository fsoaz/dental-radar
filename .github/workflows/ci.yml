name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"

      - name: Audit backend production dependencies
        working-directory: backend
        run: |
          uv sync --locked --extra dev
          uv export --quiet --locked --no-dev --no-emit-project --output-file /tmp/dental-radar-requirements.txt
          uv run --locked pip-audit --requirement /tmp/dental-radar-requirements.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dental_radar
          POSTGRES_PASSWORD: dental_radar
          POSTGRES_DB: dental_radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dental_radar -d dental_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://dental_radar:dental_radar@localhost:5432/dental_radar_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --extra dev

      - name: Ruff lint
        working-directory: backend
        run: uv run --locked ruff check .

      - name: Ruff format
        working-directory: backend
        run: uv run --locked ruff format --check .

      - name: Run migrations
        working-directory: backend
        run: uv run --locked alembic upgrade head

      - name: Pytest
        working-directory: backend
        run: uv run --locked pytest -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Vitest
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
