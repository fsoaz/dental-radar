name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dental_radar
          POSTGRES_PASSWORD: dental_radar
          POSTGRES_DB: dental_radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dental_radar -d dental_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://dental_radar:dental_radar@localhost:5432/dental_radar_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format
        working-directory: backend
        run: ruff format --check .

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Pytest
        working-directory: backend
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Vitest
        working-directory: frontend
        run: npm test
