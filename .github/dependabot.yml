version: 2
updates:
  # uv (not pip) so Dependabot regenerates backend/uv.lock alongside pyproject.toml.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
    # eslint-config-next bundles typescript-eslint (TS <6.1) and eslint-plugin-react
    # (ESLint ^9.7); drop these once both support TypeScript 7 and ESLint 10.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
