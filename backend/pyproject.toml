[project]
name = "dental-radar-backend"
version = "0.1.0"
description = "Dental Radar API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
dental-radar = "cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pip-audit>=2.9.0",
    "pytest>=8.3.0",
    "ruff==0.16.3",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/infrastructure/migrations/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
